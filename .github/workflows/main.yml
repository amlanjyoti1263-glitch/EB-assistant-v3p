name: EV Assistant V9 - Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Check Android project
      - name: Verify Android project
        run: |
          echo "Checking project..."
          test -f settings.gradle
          test -f app/build.gradle
          echo "Android project OK"

      # 5. Build Debug APK
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      # 6. Rename APK
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/EV_Assistant_V9_DEBUG.apk

      # 7. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EV-Assistant-V9-APK
          path: release/EV_Assistant_V9_DEBUG.apk
          if-no-files-found: error
